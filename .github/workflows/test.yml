name: Tests

# One job, and it is not the specification: the specification is byte identity
# against a downstream project's exported files, and that check cannot run here. What
# this job is for is narrower — a merged PR is one `flix release` away from a tag, and
# this is the only automated thing standing between the two.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      # No `lib/` is cached here, as a Flix project with Maven dependencies would
      # want: this package declares no dependency, and `packages.lock` is empty.
      # The Flix version comes from flake.lock, not from a setup action, so CI and a
      # local `nix develop` cannot disagree — the point of the pin, 0.69 and 0.79
      # differing precisely where the install instructions of this library come from.
      - name: Flake check
        run: nix flake check
      - name: Test
        run: nix run .#test
      # The release asset. `flix release` builds it too, but a tag should not be the
      # first time anyone learns whether it still builds.
      - name: Package
        run: nix run .#pkg

  floor:
    # The `flix` field of the manifest is a lower bound the compiler enforces on anyone
    # installing the package, so declaring it is making a promise: at 0.79.0 a project on
    # 0.76 through 0.78 is refused outright. 0.76.2 is the oldest version the three-key
    # `package` table exists under — 0.76.0 still requires `package.name`, which 0.79
    # forbids — and the whole suite passes there unchanged.
    # Not through Nix: nixos-26.05 carries Flix 0.69.1, and a second flake would only
    # suggest the toolchain everything is developed and released with has moved.
    name: Flix 0.76.2, the manifest floor
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Fetch Flix 0.76.2
        run: |
          curl -sSfL --max-time 300 -o flix.jar https://github.com/flix/flix/releases/download/v0.76.2/flix.jar
          echo "be06d8c0cc3afdf676981f48d743354151c7060f6fe8e689720226682a80c8ae  flix.jar" | sha256sum --check --status
      - name: Test
        run: java -jar flix.jar test
